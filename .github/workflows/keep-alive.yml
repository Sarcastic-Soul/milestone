# Render's free plan sleeps after 15 minutes idle. Ping it so judges never wait for a cold start.
# Set the APP_URL repository variable (Settings > Secrets and variables > Actions > Variables).
name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    if: vars.APP_URL != ''
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --max-time 60 "${{ vars.APP_URL }}/api/ping"
